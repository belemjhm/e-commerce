<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/estilos.css">
    <title>Registro</title>
</head>

<body>

    <h1 id="titulo">Crear cuenta</h1>

    <p>Únete a nuestra comunidad y recibe ofertas exclusivas</p>

    <div id="centro">

    <form class="miFormulario">

        <label for="nombre">Nombre completo</label>
        <input id="nombre" type="text" placeholder="Ej. Erika Jhoana" required>

        <label for="correo">Correo electrónico</label>
        <input id="correo" type="email" placeholder="ejemplo@correo.com" required>

        <label for="password">Contraseña</label>
        <input id="password" type="password" placeholder="Mínimo 8 carácteres" required>

        <label for="fecha">Fecha de nacimiento</label>
        <input id="fecha" type="date" required>

        <label for="telefono">Teléfono</label>
        <input id="telefono" type="tel" placeholder="Ej. 9921116745" required>

        <label class="terminos">
            <input type="checkbox" required> Acepto los términos y condiciones
        </label>

        <button type="submit" class="miBoton">Registrarse</button>

    </form>

    <img src="../imgs/gatito.png" width="400px">

    </div>

    <div class="mancha mancha1"></div>
    <div class="mancha mancha2"></div>
    <div class="mancha mancha3"></div>
    <div class="mancha mancha4"></div>
    <div class="mancha mancha5"></div>

</body>

</html>
