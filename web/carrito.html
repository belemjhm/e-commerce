<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/estilos.css">
    <title>Carrito de compra</title>
</head>

<body>

    <header>
        <nav>
            <ul>
                <li><img src="../imgs/logo.png" alt="Logo de Oh My Dog"></li>
                <li><h1>Oh My Dog!</h1></li>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="quienes-somos.html">Quiénes somos</a></li>
                <li><a href="catalogo.html">Catálogo</a></li>
                <li><a href="carrito.html"><img src="../imgs/carrito.png" alt="Carrito" id="op_img"></a></li>
                <li><a href="busqueda.html"><img src="../imgs/lupa.png" alt="Buscar" id="op_img"></a></li>
            </ul>
        </nav>
    </header>

    <main>

        <div id="contenedor-carrito">

            <h2>Carrito de compra</h2>

            <table>

                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Precio</th>
                        <th>Cantidad</th>
                        <th>Subtotal</th>
                        <th>Acción</th>
                    </tr>
                </thead>

                <tbody id="lista-carrito">
                </tbody>

            </table>

            <div id="resumen-compra">

                <h2>Resumen de compra</h2>

                <div class="envio">
                    <img src="../imgs/entrega.png" alt="Entrega">

                    <div>
                        <h3>Envío estándar</h3>
                        <p>Entrega estimada: 3 - 5 días hábiles</p>
                    </div>

                    <span>$60.00</span>
                </div>

                <div class="linea-resumen">
                    <p>Subtotal</p>
                    <span id="subtotal-carrito">$0.00</span>
                </div>

                <div class="linea-resumen">
                    <p>Envío</p>
                    <span id="envio-carrito">$60.00</span>
                </div>

                <div class="total">
                    <h3>Total</h3>
                    <h3 id="total-carrito">$0.00</h3>
                </div>

                <div class="acciones">
                    <button id="btn_comprar">Finalizar compra</button>
                    <button id="btn_seguir">Seguir comprando</button>
                </div>

            </div>

        </div>

    </main>

    <script src="../assets/js/carrito.js"></script>

</body>

</html>
